services:
  llm-api-proxy:
    container_name: llm-api-proxy
    image: llm-api-proxy:latest
    build: .
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - llm-data:/app/logs
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  llm-data:
    driver: local
