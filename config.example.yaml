server:
  host: "0.0.0.0"
  port: 8348
  master_key: ""

providers:
  - name: "OpenRouter"
    type: openai
    api_key: "${OPENROUTER_API_KEY}"
    base_url: "https://openrouter.ai/api"
    circuit_breaker:
      failure_threshold: 3
      recovery_timeout: 30

  # - name: "Groq"
  #   type: openai
  #   api_key: "${GROQ_API_KEY}"
  #   base_url: "https://api.groq.com/openai"
  #   circuit_breaker:
  #     failure_threshold: 3
  #     recovery_timeout: 30

  - name: "NVIDIA"
    type: openai
    api_key: "${NVIDIA_API_KEY}"
    base_url: "https://integrate.api.nvidia.com"
    circuit_breaker:
      failure_threshold: 3
      recovery_timeout: 30

  # - name: "GitHubModels"
  #   type: openai
  #   api_key: "${GITHUB_API_KEY}"
  #   base_url: "https://models.github.ai/inference"
  #   circuit_breaker:
  #     failure_threshold: 3
  #     recovery_timeout: 30

  # - name: "Cloudflare"
  #   type: openai
  #   api_key: "${CLOUDFLARE_API_KEY}"
  #   base_url: "https://api.cloudflare.com/client/v4/accounts/f127d03f04d6fb3aea6e30e6bccd7507/ai"
  #   circuit_breaker:
  #     failure_threshold: 3
  #     recovery_timeout: 30

  # - name: "SiliconFlow"
  #   type: openai
  #   api_key: "${SILICONFLOW_API_KEY}"
  #   base_url: "https://api.siliconflow.com"
  #   circuit_breaker:
  #     failure_threshold: 3
  #     recovery_timeout: 30

  - name: "LLM7"
    type: openai
    api_key: "${LLM7_API_KEY}"
    base_url: "https://api.llm7.io"
    circuit_breaker:
      failure_threshold: 3
      recovery_timeout: 30

  - name: "OpenCode"
    type: [openai, anthropic, google, openai_responses]
    api_key: "${OPENCODE_API_KEY}"
    base_url: "https://opencode.ai/zen"
    circuit_breaker:
      failure_threshold: 3
      recovery_timeout: 30

logging:
  log_dir: "logs"
  log_file: "requests.ndjson"

rate_limits:
  rpm: 60
  tpm: 90000

# auto 路由组：调用方使用 model="auto:<group>" 触发
# 自动在多个模型间轮询，429 时跳过热模型，同一会话尽量路由到同一模型
auto_routing:
  - name: free
    targets:
      - OpenRouter/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
      - OpenRouter/poolside/laguna-xs.2:free
      - OpenRouter/poolside/laguna-m.1:free
      - OpenRouter/deepseek/deepseek-v4-flash:free
      - OpenRouter/moonshotai/kimi-k2.6:free
      - OpenRouter/google/gemma-4-31b-it:free
      - OpenRouter/nvidia/nemotron-3-super-120b-a12b:free
      - OpenRouter/nvidia/nemotron-3-nano-30b-a3b:free
      - OpenRouter/nvidia/nemotron-nano-12b-v2-vl:free
      - OpenRouter/qwen/qwen3-next-80b-a3b-instruct:free
      - OpenRouter/nvidia/nemotron-nano-9b-v2:free
      - OpenRouter/openai/gpt-oss-120b:free
      - OpenRouter/openai/gpt-oss-20b:free
      - OpenRouter/z-ai/glm-4.5-air:free
      - OpenRouter/qwen/qwen3-coder:free
      - OpenRouter/cognitivecomputations/dolphin-mistral-24b-venice-edition:free
      - OpenRouter/meta-llama/llama-3.3-70b-instruct:free
      - OpenRouter/meta-llama/llama-3.2-3b-instruct:free
      - OpenRouter/nousresearch/hermes-3-llama-3.1-405b:free
      - OpenCode/deepseek-v4-flash-free
      - OpenCode/nemotron-3-super-free
      - OpenCode/mimo-v2.5-free
      - OpenCode/big-pickle
  - name: T1-free
    targets:
      - OpenRouter/deepseek/deepseek-v4-flash:free
      - OpenRouter/moonshotai/kimi-k2.6:free
      - NVIDIA/minimaxai/minimax-m2.7
      - NVIDIA/z-ai/glm-5.1
      - OpenCode/deepseek-v4-flash
      - OpenCode/big-pickle
    failure_threshold: 2
  - name: T2-free
    targets:
      - NVIDIA/stepfun-ai/step-3.7-flash
      - OpenRouter/google/gemma-4-31b-it:free
      - OpenRouter/nvidia/nemotron-3-super-120b-a12b:free
      - OpenRouter/qwen/qwen3-next-80b-a3b-instruct:free
      - OpenRouter/openai/gpt-oss-120b:free
      - OpenRouter/qwen/qwen3-coder:free
      - OpenRouter/nousresearch/hermes-3-llama-3.1-405b:free
      - OpenCode/nemotron-3-super-free
      - OpenCode/mimo-v2.5-free
    failure_threshold: 1
